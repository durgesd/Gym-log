<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymLog">
<meta name="description" content="Professional offline workout tracker with custom exercises, PR tracking and progress analytics.">
<title>GymLog — Pro Workout Tracker</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">

<!-- Icons — PNG primary, SVG fallback -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="GymLog">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">G</span>
      <span class="brand-name">GymLog</span>
      <span class="brand-tag">Pro</span>
    </div>
    <div class="spacer"></div>
    <button class="btn sm primary hidden" id="installBtn" style="margin-right:2px;">Install</button>
    <button class="icon-btn" data-act="quick-menu" aria-label="Quick actions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/>
      </svg>
    </button>
  </header>

  <main id="main">
    <section id="view-workout" class="view"></section>
    <section id="view-history" class="view hidden"></section>
    <section id="view-stats" class="view hidden"></section>
    <section id="view-library" class="view hidden"></section>
    <section id="view-settings" class="view hidden"></section>
  </main>

  <nav class="tabbar">
    <button data-tab="workout" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M3.5 9.5v5M17.5 6.5v11M20.5 9.5v5M6.5 12h11"/></svg>
      Workout
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/><path d="M12 7.5V12l3.5 2"/></svg>
      History
    </button>
    <button data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><rect x="5" y="11" width="3.2" height="6" rx="1"/><rect x="10.4" y="6" width="3.2" height="11" rx="1"/><rect x="15.8" y="14" width="3.2" height="3" rx="1"/></svg>
      Stats
    </button>
    <button data-tab="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H19v15H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M8 8h7M8 12h5"/></svg>
      Library
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
      Settings
    </button>
  </nav>
</div>

<div id="restbar" class="restbar hidden">
  <div class="rest-top">
    <span class="rest-time" id="restTime">1:30</span>
    <span class="rest-lbl" id="restLbl">Resting</span>
    <div class="spacer"></div>
    <button class="rest-btn" data-act="rest-minus">−15</button>
    <button class="rest-btn" data-act="rest-plus">+15</button>
    <button class="rest-btn pri" data-act="rest-skip">Skip</button>
  </div>
  <div class="rest-track"><div class="rest-fill" id="restFill"></div></div>
</div>

<div id="modal" class="modal hidden"></div>
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
